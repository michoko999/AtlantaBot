name: Build and Publish Docker Image

on:
  workflow_dispatch:
  schedule:
    # S'exécute automatiquement toutes les 6 heures
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    environment: docker

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout AtlantaBot upstream
        uses: actions/checkout@v4
        with:
          repository: Androz2091/AtlantaBot
          ref: master

      - name: Prepare build context
        run: |
          # 1. Écrase le .dockerignore restrictif
          echo -e "node_modules\n.git\n.github" > .dockerignore

          # 2. Génère package-lock.json s'il est absent du dépôt
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi

          # 3. Patch du Dockerfile :
          # - Ajoute Python et build-essential dans le builder pour compiler les modules natifs
          # - Dans le runner, copie directement node_modules depuis le builder au lieu de relancer npm ci
          node -e '
            const fs = require("fs");
            let df = fs.readFileSync("Dockerfile", "utf8");

            df = df.replace(
              "RUN npm ci",
              "RUN apt-get update && apt-get install -y --no-install-recommends python3 python-is-python3 build-essential && rm -rf /var/lib/apt/lists/*\nRUN npm ci"
            );

            df = df.replace(
              "RUN npm ci --omit=dev",
              "COPY --from=builder /app/node_modules ./node_modules"
            );

            fs.writeFileSync("Dockerfile", df);
          '

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/atlantabot
            ghcr.io/${{ github.repository_owner }}/atlantabot
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
